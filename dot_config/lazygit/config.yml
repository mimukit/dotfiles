gui:
  theme:
    activeBorderColor:
      - "#a6e3a1"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#a6e3a1"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  authorColors:
    "*": "#b4befe"
  # Show how far the branch has drifted from its base, with the count.
  showDivergenceFromBaseBranch: arrowAndNumber

git:
  commit:
    autoWrapWidth: 72

os:
  # Matches EDITOR=nvim in .zshrc, and teaches lazygit the line-number flags.
  editPreset: nvim

# Left on. Every commitkit command below except `G` runs as a subprocess, and
# this is what makes each one print what it did and wait. Turned off, a discard
# and a failed signed commit both look identical to nothing happening.
promptToReturnFromSubprocess: true

customCommands:
  # Every entry calls ~/.local/bin/git-commitkit (chezmoi:
  # private_dot_local/bin/executable_git-commitkit), which runs Claude on Haiku
  # with the commitkit skill and writes the message to lazygit's own pending
  # commit file. This replaced a command that piped the diff to pbcopy and opened
  # a Raycast AI command; that left the terminal and ignored the commitkit
  # convention the rest of the kits assume.
  #
  # The full path is deliberate. lazygit started from a GUI pane does not always
  # inherit the PATH that .zshrc builds.

  # Shift+G writes the message and stops. `output: none` plus `loadingText` is
  # the only shape lazygit gives a spinner to: handler_creator.go wraps the final
  # command in WithWaitingStatus, while a prompt's command runs bare. An earlier
  # version put a menu on this key through a menuFromCommand prompt, which meant
  # the generation happened inside the prompt and froze for two seconds with no
  # indicator, so the menu is gone and the actions have their own keys.
  #
  # Press c straight after and lazygit's commit panel opens already filled in.
  - key: "G"
    context: "files"
    description: "Write a commit message (commitkit)"
    command: '"$HOME/.local/bin/git-commitkit"'
    loadingText: "Writing commit message"
    output: none

  # The acting keys take the free shifted slots, since lazygit owns c, e and x in
  # the files panel. They run as subprocesses so their output is readable.
  - key: "<c-g>"
    context: "files"
    description: "Write a commit message and commit it (commitkit)"
    command: '"$HOME/.local/bin/git-commitkit" --commit'
    output: terminal

  - key: "E"
    context: "files"
    description: "Write a commit message and open it in nvim (commitkit)"
    command: '"$HOME/.local/bin/git-commitkit" --edit'
    output: terminal

  - key: "X"
    context: "files"
    description: "Discard the pending commit message (commitkit)"
    command: '"$HOME/.local/bin/git-commitkit" --clear'
    output: terminal

  # Reword lives on M, not G. lazygit binds G in the commits panel to
  # openPullRequestInBrowser, and a built-in beats a custom command in the same
  # context, so a G here would silently open a browser instead.
  - key: "M"
    context: "commits"
    description: "Reword the last commit with commitkit"
    command: '"$HOME/.local/bin/git-commitkit" --amend'
    output: terminal
