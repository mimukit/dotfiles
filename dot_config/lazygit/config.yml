gui:
  theme:
    activeBorderColor:
      - "#a6e3a1"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#a6e3a1"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  authorColors:
    "*": "#b4befe"
  # Show how far the branch has drifted from its base, with the count.
  showDivergenceFromBaseBranch: arrowAndNumber

git:
  commit:
    autoWrapWidth: 72

os:
  # Matches EDITOR=nvim in .zshrc, and teaches lazygit the line-number flags.
  editPreset: nvim

# The `E` and `M` commands below hand the terminal to nvim. Without this, each
# one ends on a "press enter to return to lazygit" step.
promptToReturnFromSubprocess: false

customCommands:
  # Every entry calls ~/.local/bin/git-commitkit (chezmoi:
  # private_dot_local/bin/executable_git-commitkit), which runs Claude on Haiku
  # with the commitkit skill and writes the message to lazygit's own pending
  # commit file. This replaced a command that piped the diff to pbcopy and opened
  # a Raycast AI command; that left the terminal and ignored the commitkit
  # convention the rest of the kits assume.
  #
  # The full path is deliberate. lazygit started from a GUI pane does not always
  # inherit the PATH that .zshrc builds.

  # Shift+G writes the message first, then asks what to do with it. The menu is
  # the only modal in the flow and it appears once the work is done, so it shows
  # the actual message instead of asking you to choose blind.
  #
  # The mechanism is a `menuFromCommand` prompt. lazygit runs the prompt's
  # command, parses each output line into a menu entry, and only then runs the
  # custom command with the chosen value in {{.Form.action}}. --menu stores the
  # message before it prints, so every branch below reuses that one generation
  # rather than paying for a second call and returning a different message.
  #
  # `output: terminal` is set because the edit branch hands the terminal to nvim.
  # The other branches finish instantly, and promptToReturnFromSubprocess above
  # keeps them from stopping on a "press enter" step.
  - key: "G"
    context: "files"
    description: "Write a commit message (commitkit)"
    prompts:
      - type: menuFromCommand
        title: "commitkit"
        # A prompt's command is fork/exec'd, not run through a shell, so an
        # unwrapped "$HOME/..." arrives as a literal path and fails to open.
        # The custom command's own `command` below does go through a shell.
        command: 'sh -c ''exec "$HOME/.local/bin/git-commitkit" --menu'''
        filter: '(?P<action>[^|]*)\|(?P<label>.*)'
        valueFormat: '{{.action}}'
        labelFormat: '{{.label}}'
        key: "action"
    command: >-
      case "{{.Form.action}}" in
        commit) "$HOME/.local/bin/git-commitkit" --commit-pending ;;
        edit) "$HOME/.local/bin/git-commitkit" --edit-pending ;;
        discard) "$HOME/.local/bin/git-commitkit" --clear ;;
        *) : ;;
      esac
    output: terminal

  # Reword lives on M, not G. lazygit binds G in the commits panel to
  # openPullRequestInBrowser, and a built-in beats a custom command in the same
  # context, so a G here would silently open a browser instead.
  - key: "M"
    context: "commits"
    description: "Reword the last commit with commitkit"
    command: '"$HOME/.local/bin/git-commitkit" --amend'
    output: terminal
